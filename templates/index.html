            </div>
          </div>

          <div class="preview-note">※ 본 미리보기는 입력 내용 확인용이며, 실제 조각 시안과 위치·간격·비율이 차이가 있습니다.</div>
          <div class="section-title right-panel-title calc-out-title">계산 결과</div>
          <div class="card calc-card">
            <div class="calc-panel-head">
              <button class="btn calc-btn" type="button" onclick="calc()">계산하기</button>
            </div>
            <div class="summary" id="summaryBox"></div>
          </div>
        </aside>
      </div>
    </section>
  </form>
</main>

<div class="actionbar">
  <button class="btn btn-primary" type="button" onclick="saveForm()">저장</button>
  <button class="btn" type="button" onclick="openList()">저장목록</button>
  <button class="btn" type="button" onclick="window.print()">프린트</button>
  <button class="btn btn-danger" type="button" onclick="resetCurrentPage()">초기화</button>
  <span class="save-msg" id="saveMsg"></span><span class="grow"></span>
</div>

<div class="drawer-bg" id="drawerBg" onclick="closeList()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h2>저장목록</h2><button class="btn" type="button" onclick="closeList()">닫기</button></div>
  <div class="drawer-search"><input id="listSearch" placeholder="계약번호, 계약자, 유형으로 검색" oninput="renderList(savedList)" /></div>
  <div class="drawer-body"><div id="listBody"></div></div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
const CATALOG = {{ catalog|tojson }};
const RULES = {{ rules|tojson }};
const STAFF = {{ staff_list|tojson }};
const STATUS = {{ status_list|tojson }};
const STONE_CATEGORIES = {{ stone_categories|tojson }};
let savedList = {{ saved_list|tojson }};
let currentSummary = null;
const $ = (id)=>document.getElementById(id);
const money = (n)=> (Number(n||0)).toLocaleString('ko-KR') + '원';
const esc = (s)=>String(s||'').replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));

const SUBCATEGORY_LABELS = {
  '평장부부B': {
    '1번': '1번(동그란 종교마크)',
    '2번': '2번(큰오석 왼쪽에 작은오석)',
    '3번': '3번(드라큘라 모양)',
    '4번': '4번(3번이랑 비슷하나, 아래가 조금 더 넓음)'
  }
};
function getSubcategoryLabel(cat, sub){
  return (SUBCATEGORY_LABELS[cat] && SUBCATEGORY_LABELS[cat][sub]) || sub || '선택';
}
function fillSelect(el, list, selected=''){
  el.innerHTML = '';
  list.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v||'선택'; if(v===selected) o.selected=true; el.appendChild(o); });
}
function init(){
  fillSelect($('category'), Object.keys(CATALOG), '매장묘');
  fillSubcategory('단장');
  ['writer','designer','checker'].forEach(id=>fillSelect($(id), STAFF));
  fillSelect($('status'), STATUS, '접수됨');
  renderSlots(1);
  bindInputs(); updateUI(); renderList(savedList); calc();
}
function fillSubcategory(selected=''){
  const cat = $('category').value;
  const list = CATALOG[cat] || [];
  const el = $('subcategory');
  el.innerHTML = '';
  list.forEach(v=>{
    const o=document.createElement('option');
    o.value=v;
    o.textContent=getSubcategoryLabel(cat, v);
    if(v===(selected || list[0])) o.selected=true;
    el.appendChild(o);
  });
}
function ruleKey(){return $('category').value + '||' + $('subcategory').value}
function getRule(){return RULES[ruleKey()] || {slots:1,has_side:false,stone_photo:false,front_style:'standard'}}
function isMaejangFront(){ return getRule().front_style === 'maejang'; }
function isSingleMaejang(){ return $('category').value==='매장묘' && $('subcategory').value==='단장'; }
function makeTemplateLabel(){
  const cat = $('category')?.value || '';
  const sub = $('subcategory')?.value || '';
  const parts = [cat, sub].filter(Boolean);
  if(cat === '매장묘') parts.push($('sizeType')?.value || '');
  return parts.filter(Boolean).join(' / ');
}
function updateTemplateLabel(){
  const el = $('templateLabel');
  if(el) el.value = makeTemplateLabel();
}
function showPage(page){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.page===page));
  $(page).classList.add('active');
}
function renderSlots(count){
  // 송수재 개인/부부는 기본 고인 1명만 표시하고, 필요 시 고인 추가 버튼으로 추가
  const catForSlots = $('category') ? $('category').value : '';
  const subForSlots = $('subcategory') ? $('subcategory').value : '';
  const forceFourSlots = (catForSlots==='평장부부B' && ['1번','3번','4번'].includes(subForSlots)) ||
                         (catForSlots==='4기' && ['A','B','P','4기A','4기B','4기P'].includes(subForSlots)) ||
                         catForSlots==='평장4기P';
  const minSlots = forceFourSlots ? 4 : (catForSlots==='송수재' ? 1 : (getRule().slots||1));
  count=Math.max(minSlots,Math.min(10,Number(count||minSlots))); $('slotCount').value=count; let html='';
  for(let i=1;i<=count;i++){
    const canDel=count>minSlots&&i>1;
    html+=`<div class="slot-box" data-slot="${i}">
      <div class="slot-head"><span>고인 ${i}</span>${canDel?`<button class="btn small-btn" type="button" onclick="removeSlot(${i})">삭제</button>`:''}</div>
      <div class="grid2">
        <div class="is-big"><label class="lbl">이름</label><input name="f${i}_name" id="f${i}Name" /></div>
        <div class="is-big"><label class="lbl">세례명</label><input name="f${i}_baptism" id="f${i}Baptism" /></div>
      </div>
      <div class="grid2 slot-person-religion hidden" data-person-religion-slot="${i}">
        <div class="is-big"><label class="lbl">고인 ${i} 종교마크</label><select name="f${i}_religion_mark" id="f${i}ReligionMark"><option value="">없음</option><option>불교</option><option>기독교</option><option>천주교</option></select></div>
      </div>
      <div class="birth-row hidden" id="birthRow${i}"><div class="grid2">
        <div class="is-small"><label class="lbl">생년월일 <span class="date-note">(음력이면 "음"글자 직접 기재)</span></label><input name="f${i}_birth" id="f${i}Birth" /></div>
        <div class="is-small"><label class="lbl">생 표현</label><select name="f${i}_birth_type" id="f${i}BirthType" onchange="birthTypeChanged(${i})"><option>생</option><option>없음</option><option>옵션 삭제</option></select></div>
      </div></div>
      <div class="grid2 death-row">
        <div class="is-small"><label class="lbl">사망일 <span class="date-note">(음력이면 "음"글자 직접 기재)</span></label><input name="f${i}_death" id="f${i}Death" /></div>
        <div class="is-small"><label class="lbl">사망 표현</label><select name="f${i}_death_type"><option value="">선택</option><option>졸</option><option>선종</option><option>소천</option><option>없음</option></select></div>
      </div>
      <div class="birth-action"><button class="btn-add-birth" type="button" id="birthBtn${i}" onclick="showBirth(${i})">＋ 생년월일</button></div>
      <div class="slot-stone-photo hidden" data-stone-slot="${i}">
        <label><input type="checkbox" name="f${i}_stone_photo" id="f${i}StonePhoto" value="yes" onchange="updatePreview();calc();" /> 고인 ${i} 스톤포토 추가</label>
      </div>
    </div>`;
  }
  $('slots').innerHTML=html; bindInputs(); updatePreview(); calc();
}
function showBirth(i){
  $('birthRow'+i).classList.remove('hidden');
  $('birthBtn'+i).classList.add('hidden');
  const bt=$('f'+i+'BirthType');
  // 이미 저장/불러오기 값이 있으면 유지하고, 새로 추가할 때만 기본값을 '생'으로 둔다.
  if(bt && !bt.value) bt.value='생';
}
function hideBirth(i){
  const b=$('f'+i+'Birth'), bt=$('f'+i+'BirthType');
  if(b) b.value='';
  if(bt) bt.value='생';
  $('birthRow'+i).classList.add('hidden');
  $('birthBtn'+i).classList.remove('hidden');
  updatePreview(); calc();
}
function birthTypeChanged(i){
  const bt=$('f'+i+'BirthType');
  // '없음'은 날짜는 유지하고 '생' 글자만 빼는 옵션이다.
  // 생년월일 칸 자체를 없애려면 '옵션 삭제'를 선택한다.
  if(bt && bt.value==='옵션 삭제') hideBirth(i);
}
function showSideBirth(i){
  $('sideBirthRow'+i).classList.remove('hidden');
  $('sideBirthBtn'+i).classList.add('hidden');
  const bt=$('s'+i+'BirthType');
  if(bt && !bt.value) bt.value='생';
}
function hideSideBirth(i){
  const b=$('s'+i+'Birth'), bt=$('s'+i+'BirthType');
  if(b) b.value='';
  if(bt) bt.value='생';
  $('sideBirthRow'+i).classList.add('hidden');
  $('sideBirthBtn'+i).classList.remove('hidden');
  updatePreview(); calc();
}
function sideBirthTypeChanged(i){
  const bt=$('s'+i+'BirthType');
  if(bt && bt.value==='옵션 삭제') hideSideBirth(i);
}
function addSlot(){
  const current = Number($('slotCount').value || 1);
  const data = collectForm();
  data.slot_count = current + 1;
  renderSlots(current + 1);
  fillForm(data);
}
function removeSlot(i){
  const minSlots=getRule().slots||1, count=Number($('slotCount').value);
  if(count<=minSlots) return;
  const data=collectForm();
  for(let n=i;n<count;n++){['name','baptism','birth','birth_type','death','death_type','religion_mark'].forEach(k=>data['f'+n+'_'+k]=data['f'+(n+1)+'_'+k]||'');}
  data.slot_count=count-1;  // slot_count 먼저 갱신
  renderSlots(count-1); fillForm(data);
}
function bindInputs(){
  document.querySelectorAll('input,select,textarea').forEach(el=>{
    el.oninput=()=>{updatePreview();};
    el.onchange=()=>{
      const m = el.id && el.id.match(/^f(\d+)BirthType$/);
      const sm = el.id && el.id.match(/^s(\d+)BirthType$/);
      if(m && el.value==='옵션 삭제') birthTypeChanged(Number(m[1]));
      if(sm && el.value==='옵션 삭제') sideBirthTypeChanged(Number(sm[1]));
      updateUI(); updatePreview();
    };
  });
  $('category').onchange=()=>{ fillSubcategory(); updateUI(true); updatePreview(); calc(); };
  $('subcategory').onchange=()=>{ updateUI(true); updatePreview(); calc(); };
}
// 종교마크 위치 유형 (x/y: %, w: % 너비)
const MARK_POS = {
  top:    { x: 50, y: 10, w: 9 },
  left:   { x: 22, y: 10, w: 10 },
  circle: { x: 30, y: 20, w: 12 },
};
// 시안별 markType (기본값: 'top')
const DESIGN_MARK_TYPE = {
  '평장부부B||1번': 'circle',
  '평장부부B||3번': 'left',
  '평장부부B||4번': 'left',
};
const RELIGION_IMG = {'불교':'/static/images/religion/buddhist.png','기독교':'/static/images/religion/christian.png','천주교':'/static/images/religion/catholic.png'};

function updateReligionOptions(){
  const rm=$('religionMark'); if(!rm) return;
  const keep=rm.value;
  const cat=$('category')?.value || '';
  const sub=$('subcategory')?.value || '';
  const opts=['','불교','기독교','천주교'];
  if(cat==='송수재' && (sub==='개인' || sub==='부부')) opts.push('故');
  rm.innerHTML=opts.map(v=>`<option value="${esc(v)}">${v||'없음'}</option>`).join('');
  if(opts.includes(keep)) rm.value=keep;
}

function isStonePhotoComboKey(key){
  return ['단납/평장1기||기본','송수재||부부','평장부부B||기본','평장부부P||기본','평장4기||기본'].includes(key || ruleKey());
}
function isSlotStoneOn(d, i){
  const v = String((d && d['f'+i+'_stone_photo']) || '');
  return ['yes','추가','있음','on','true','1'].includes(v);
}
function stonePhotoCountFromData(d){
  const cnt = Math.max(1, Math.min(10, Number((d && d.slot_count) || $('slotCount')?.value || 1)));
  let n = 0;
  for(let i=1;i<=cnt;i++){ if(isSlotStoneOn(d, i)) n++; }
  if(n<=0 && ['yes','추가','있음'].includes(String((d && d.stone_photo) || ''))) n = 1;
  return n;
}
function updateStonePhotoSlotUI(){
  const ok = isStonePhotoComboKey(ruleKey());
  document.querySelectorAll('[data-stone-slot]').forEach(el=>{
    el.classList.toggle('hidden', !ok);
    if(!ok){ const cb=el.querySelector('input[type="checkbox"]'); if(cb) cb.checked=false; }
  });
}

function updatePersonReligionSlotUI(){
  const cat = $('category') ? $('category').value : '';
  const sub = $('subcategory') ? $('subcategory').value : '';
  const show = (cat === '평장4기') || (cat === '평장4기P') || (cat === '24기') || (cat === '4기' && ['A','4기A','R','4기R'].includes(sub));
  document.querySelectorAll('[data-person-religion-slot]').forEach(el=>{
    el.classList.toggle('hidden', !show);
    if(!show){
      const sel = el.querySelector('select');
      if(sel) sel.value = '';
    }
  });
}
function updateUI(resetSlots=false){
  updateTemplateLabel();
  updateReligionOptions();
  const catForRel = $('category') ? $('category').value : '';
  const subForRel = $('subcategory') ? $('subcategory').value : '';
  const hideGlobalReligion = (catForRel === '평장4기') || (catForRel === '24기') || (catForRel === '4기' && ['A','4기A','R','4기R'].includes(subForRel));
  if($('globalReligionWrap')) $('globalReligionWrap').classList.toggle('hidden', hideGlobalReligion);
  if(hideGlobalReligion && $('religionMark')) $('religionMark').value = '';
  const r=getRule();
  const special = isMaejangFront();
  $('sideSection').classList.toggle('hidden', !r.has_side);
  $('maejangFront').classList.toggle('hidden', !special);
  $('standardFront').classList.toggle('hidden', special);
  $('jidmyoWrap').classList.toggle('hidden', !special);
  // 한글/한자 탭: 매장묘·평장부부B 2번(maejang)에만 표시
  ['frontTypeWrap','sideTypeWrap','backTypeWrap'].forEach(id=>{ const el=$(id); if(el) el.classList.toggle('hidden', !special); });
  const isMaejang=$('category').value==='매장묘'; $('sizeWrap').classList.toggle('hidden', !isMaejang);
  const STONE_COMBOS_UI=['단납/평장1기||기본','송수재||부부','평장부부B||기본','평장부부P||기본','평장4기||기본'];
  const stoneOk=STONE_COMBOS_UI.includes(ruleKey());
  // 스톤포토는 전체 1개 체크가 아니라 고인별 체크로 관리한다. 기존 전체 체크박스는 숨김/초기화.
  $('inputStoneBox').classList.add('hidden');
  if(!stoneOk){ const sp=$('stonePhoto'); if(sp) sp.checked=false; }
  updateStonePhotoSlotUI();
  updatePersonReligionSlotUI();
  const fpEl=$('familyPhraseWrap'); if(fpEl) fpEl.classList.toggle('hidden', !r.family_phrase);
  const bubuBLayoutEl = $('bubuBFrontLayoutWrap');
  if(bubuBLayoutEl) bubuBLayoutEl.classList.toggle('hidden', !(($('category').value==='평장부부B') && ($('subcategory').value==='기본')));
  if(resetSlots){
    const catReset=$('category') ? $('category').value : '';
    const subReset=$('subcategory') ? $('subcategory').value : '';
    const forceFourReset=(catReset==='평장부부B' && ['1번','3번','4번'].includes(subReset)) ||
                         (catReset==='4기' && ['A','B','P','4기A','4기B','4기P'].includes(subReset)) ||
                         catReset==='평장4기P';
    renderSlots(forceFourReset ? 4 : (catReset==='송수재' ? 1 : (r.slots||1)));
  }
}
function collectForm(){
  const fd=new FormData($('mainForm'));
  const data={};
  fd.forEach((v,k)=>data[k]=v);
  const stoneOk = isStonePhotoComboKey(data.category + '||' + data.subcategory);
  const cnt = Math.max(1, Math.min(10, Number(data.slot_count || $('slotCount')?.value || 1)));
  let stoneCount = 0;
  if(stoneOk){
    for(let i=1;i<=cnt;i++){
      if(['yes','추가','있음','on','true','1'].includes(String(data['f'+i+'_stone_photo']||''))) stoneCount++;
    }
  }
  data.stone_photo_count = String(stoneCount);
  data.stone_photo = stoneCount > 0 ? 'yes' : '';
  return data;
}
function fillForm(data){
  if(!data) return; $('dataId').value=data.id||''; $('createdAt').value=data.created_at||''; if($('dataFile')) $('dataFile').value=data.data_file||''; if($('previewFile')) $('previewFile').value=data.preview_file||'';
  if(data.category){ $('category').value=data.category; fillSubcategory(data.subcategory); }
  renderSlots(data.slot_count || getRule().slots || 1);
  Object.entries(data).forEach(([k,v])=>{ const el=document.querySelector(`[name="${CSS.escape(k)}"]`); if(!el) return; if(el.type==='checkbox'){el.checked=['yes','추가','있음'].includes(String(v));}else{el.value=v??'';} });
  for(let i=1;i<=Number($('slotCount').value||1);i++){ if(data[`f${i}_birth`]) showBirth(i); }
  for(let i=1;i<=2;i++){ if(data[`s${i}_birth`]) showSideBirth(i); }
  updateUI(); updateStonePhotoSlotUI(); updateTemplateLabel(); updatePreview(); calc();
}
// ── 미리보기 헬퍼 ──────────────────────────────────────
function _isHanjaChar(ch){ const cp=(ch||'').charCodeAt(0); return (cp>=0x4E00&&cp<=0x9FFF)||(cp>=0x3400&&cp<=0x4DBF)||(cp>=0xF900&&cp<=0xFAFF); }
function _bongwanDisp(bongwan, hSuf, kSuf){
  const t=(bongwan||'').trim(); if(!t) return '';
  if(t.endsWith(hSuf)||t.endsWith(kSuf)) return esc(t);
  return esc(t+(_isHanjaChar(t[t.length-1])?hSuf:kSuf));
}
function _getLayoutType(){
  const cat=$('category').value, sub=$('subcategory').value;
  // 평장부부B 1/3/4는 RULES가 maejang 계열이어도 전면/후면을 별도 처리한다. 매장묘는 건드리지 않음.
  if(cat==='평장부부B' && ['1번','3번','4번'].includes(sub)) return 'couple_tb';
  if(isMaejangFront()) return 'vertical_burial';           // 매장묘, 평장부부B 2번

  // 가족형은 getRule().family_phrase보다 먼저 분기해야 실제 요청 레이아웃이 적용됨
  if(cat==='8기') return 'family_8';
  if(cat==='12기A' || cat==='20기' || cat==='30기' || (cat==='다기형' && ['12A','12기A','20기','30기'].includes(sub))) return 'family_front_back_vertical';
  if(cat==='12기B') return 'family_vertical_back_horizontal';
  if(cat==='24기') return 'family_24';

  if(getRule().family_phrase) return 'family_phrase';
  if(cat==='송수재' && sub==='개인') return 'songsujae_single';
  if(cat==='송수재' && sub==='부부') return 'songsujae_couple';
  if(cat==='평장1기P') return 'pyeongjang1p';
  if(cat==='4기' && (['A','B','P'].includes(sub) || ['4기A','4기B','4기P'].includes(sub))) return 'four_abp';
  if(cat==='4기' && (['C','R'].includes(sub) || ['4기C','4기R'].includes(sub))) return 'four_vertical';
  if(['단납/평장1기'].includes(cat)) return 'single_hoz';  // 1인형
  if(cat==='쌍납/평장부부A') return 'couple_lr';            // 좌우형
  if(['부부A','납골정','평장부부B','평장부부P'].includes(cat)) return 'couple_tb';    // 상하형
  if(cat==='평장4기P') return 'pyeong4p';
  if(cat==='평장4기') return 'pyeong4';
  if(['4기'].includes(cat)) return 'multi_person';
  return 'single_hoz';
}
function _dateLine(birth, btype, death, dtype){
  const p=[];
  if(birth) p.push(esc(birth)+(btype&&btype!=='없음'?'<span class="pv-date-type-inline-gap"></span>'+esc(btype):''));
  if(death) p.push(esc(death)+(dtype&&dtype!=='없음'?'<span class="pv-date-type-inline-gap"></span>'+esc(dtype):''));
  return p.join('<br>');
}

function _splitLinesKeepBlank(raw){
  const arr = String(raw || '').replace(/\r/g, '').split('\n');
  // 첫 줄을 비워둔 경우도 미리보기에서 그대로 보존한다. (이혼/공란 표시용)
  while(arr.length && !/\S/.test(arr[arr.length-1])) arr.pop();
  return arr;
}

function _renderBack(d){

  }
  const r1=[rField('자',d.son_text),rField('자부',d.daughter_in_law_text),rField('손',d.grandson_text)].filter(Boolean);
  const r2=[rField('녀',d.daughter_text),rField('사위',d.son_in_law_text),rField('외손',d.maternal_grandchild_text)].filter(Boolean);
  if(!r1.length&&!r2.length&&!d.etc_text) return '';

function _relHtml(rel, sz){

function _dateCharsDisplay(birth, btype, death, dtype){
  // 매장묘/평장부부B 2번 측면 날짜:
  // 생년월일은 왼쪽, 사망일은 오른쪽 2열로 분리한다.
  // 각 열 안에서는 날짜 아래에 생/졸 표현이 오고, 날짜와 표현 사이 간격을 둔다.
  function renderChars(text){
    return [...String(text||'').replace(/\s+/g,'')].map(c=>{
      const cls = c==='.' ? 'pv-date-dot' : 'pv-date-char';
      return `<div class="${cls}">${esc(c)}</div>`;
    }).join('');
  }
  function renderCol(text, type, extraClass){
    // 날짜가 없으면 생/졸 표현만 단독으로 띄우지 않는다.
    // 입력값이 있을 때만 날짜 + 표현을 보여준다.
    if(!String(text || '').trim()) return '';
    let html = renderChars(text);
    if(type && type!=='없음') html += '<div class="pv-date-type-v-gap"></div>' + renderChars(type);
    return `<div class="pv-burial-side-chars ${extraClass}">${html}</div>`;
  }
  const birthCol = renderCol(birth, btype, 'pv-burial-birth-col');
  const deathCol = renderCol(death, dtype, 'pv-burial-death-col');
  if(!birthCol && !deathCol) return '';
  return `<div class="pv-burial-side-date-pair">${birthCol}${deathCol}</div>`;
}
function _renderBackBurial(d){
  // 매장묘/평장부부B 2번/부부A 후면: 사람 1명 = 고정폭 세로 1열.
  // 글자 크기를 키워도 column 폭/줄간격은 px로 고정되어 간격이 뒤틀리지 않는다.
  function field(lbl, val){
    const raw=String(val||'').replace(/\r/g,'');
    if(!/\S/.test(raw)) return '';
    const names=_splitLinesKeepBlank(raw);
    const lblHtml=[...lbl].map(c=>`<div>${esc(c)}</div>`).join('');
    const nameCols=names.map(name=>{
      if(!/\S/.test(name)) return `<div class="pv-bb-person-col pv-bb-person-col-empty"><span class="pv-bb-person-char">&nbsp;</span></div>`;
      const chars=[...name].map(c=>`<span class="pv-bb-person-char">${c===' ' ? '&nbsp;' : esc(c)}</span>`).join('');
      return `<div class="pv-bb-person-col">${chars}</div>`;
    }).join('');
    return `<div class="pv-bb-field"><div class="pv-bb-label-chars">${lblHtml}</div><div class="pv-bb-name-gap"></div><div class="pv-bb-name-row">${nameCols}</div></div>`;
  }
  // 4열 그리드, DOM 순서(좌→우): 사위 녀 자부 자 / empty 외손 empty 손
  // justify-content:end → 오른쪽 정렬, 시각 우→좌: 자 자부 녀 사위 / 손 . 외손 .
  const silF=field('사위',d.son_in_law_text);
  const daughterF=field('녀',d.daughter_text);
  const dilF=field('자부',d.daughter_in_law_text);
  const sonF=field('자',d.son_text);
  const mgcF=field('외손',d.maternal_grandchild_text);
  const grandsonF=field('손',d.grandson_text);
  const etc=String(d.etc_text||'').replace(/\r/g,'');
  if(!silF&&!daughterF&&!dilF&&!sonF&&!mgcF&&!grandsonF&&!/\S/.test(etc)) return '';
  let html=`<div class="pv-bb-desc-grid">`;
  html+=`<div class="pv-bb-col-cell">${silF}</div>`;
  html+=`<div class="pv-bb-col-cell">${daughterF}</div>`;
  html+=`<div class="pv-bb-col-cell">${dilF}</div>`;
  html+=`<div class="pv-bb-col-cell">${sonF}</div>`;
  html+=`<div class="pv-bb-col-cell"></div>`;
  html+=`<div class="pv-bb-col-cell">${mgcF}</div>`;
  html+=`<div class="pv-bb-col-cell"></div>`;
  html+=`<div class="pv-bb-col-cell">${grandsonF}</div>`;
  html+=`</div>`;
  if(/\S/.test(etc)) html+=`<div class="pv-bb-row"><div class="pv-bb-etc">${esc(etc)}</div></div>`;
  return `<div class="pv-burial-back">${html}</div>`;
}

  return `<div class="pv-family-front">${_relHtml(rel,64)}<div class="${phraseClass}">${esc(phrase)}</div></div>`;
}

function _renderBackBurialR(d){
  // 4기 R 전용: 매장묘 후면 렌더 방식을 복사해서 쓰되, 매장묘 함수는 절대 변경하지 않음.
  // 요청 순서: < 외손 손 사위 녀 자부 자 > 한 줄
  function field(lbl, val){
    const raw=String(val||'').replace(/\r/g,'');
    if(!/\S/.test(raw)) return '';
    const names=_splitLinesKeepBlank(raw);
    const nameCols=names.map(name=>{
      if(!/\S/.test(name)) return `<div class="pv-bb-person-col pv-bb-person-col-empty"><span class="pv-bb-person-char">&nbsp;</span></div>`;
      return `<div class="pv-bb-person-col">${[...name].map(c=>`<span class="pv-bb-person-char">${c===' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</div>`;
    }).join('');
    const lblHtml=[...lbl].map(c=>`<div>${esc(c)}</div>`).join('');
    return `<div class="pv-bb-field"><div class="pv-bb-label-chars">${lblHtml}</div><div class="pv-bb-name-gap"></div><div class="pv-bb-name-row">${nameCols}</div></div>`;
  }
  const mgcF=field('외손',d.maternal_grandchild_text);
  const grandsonF=field('손',d.grandson_text);
  const silF=field('사위',d.son_in_law_text);
  const daughterF=field('녀',d.daughter_text);
  const dilF=field('자부',d.daughter_in_law_text);
  const sonF=field('자',d.son_text);
  const etc=String(d.etc_text||'').replace(/\r/g,'');
  if(!sonF&&!dilF&&!daughterF&&!silF&&!mgcF&&!grandsonF&&!/\S/.test(etc)) return '';
  let html='<div class="pv-back-r-grid">';
  html+=`<div class="pv-bb-col-cell">${mgcF}</div>`;
  html+=`<div class="pv-bb-col-cell">${grandsonF}</div>`;
  html+=`<div class="pv-bb-col-cell">${silF}</div>`;
  html+=`<div class="pv-bb-col-cell">${daughterF}</div>`;
  html+=`<div class="pv-bb-col-cell">${dilF}</div>`;
  html+=`<div class="pv-bb-col-cell">${sonF}</div>`;
  html+='</div>';
  if(/\S/.test(etc)) html+=`<div class="pv-bb-row"><div class="pv-bb-etc">${esc(etc)}</div></div>`;
  return `<div class="pv-burial-back">${html}</div>`;
}

function _renderPyeong4PFront(d){

  const rel=d.religion_mark||'';

  for(let i=1;i<=cnt;i++){
    const nm=d['f'+i+'_name']||'', bp=d['f'+i+'_baptism']||'';

    if(!nm && !bp && !dt && !personRel) continue;
   const relHtml=personRel?`<span class="pv-pyeong4p-person-rel pv-pyeong4p-person-rel-big" style="display:inline-flex;align-items:center;justify-content:center;line-height:1;">${_relHtml(personRel,92)}</span>`:'';
    const nameLine=`<span class="pv-pyeong4p-name">${relHtml}${nm?`<span>${esc(nm)}</span>`:'<span style="opacity:.3">성명</span>'}${bp?`<span class="pv-pyeong4p-bp-after">${esc(bp)}</span>`:''}</span>`;

function _renderPyeong4Front(d){
  // 평장4기 기본: 고인마다 개별 종교마크. 없음 선택 시 표시하지 않음.
  // 이름/날짜는 같은 축으로 가운데 정렬하고 날짜는 줄바꿈 없이 간격을 둔다.
  const cnt=Math.max(4, Number(d.slot_count||4));
  let persons='';
  for(let i=1;i<=cnt;i++){
    const nm=d['f'+i+'_name']||'', bp=d['f'+i+'_baptism']||'';
    const rel=_slotReligion(d,i);
    const b4=d['f'+i+'_birth'],bt4=d['f'+i+'_birth_type'],de4=d['f'+i+'_death'],dt4=d['f'+i+'_death_type'];
    const dtArr=[];
    if(b4) dtArr.push(esc(b4)+(bt4&&bt4!=='없음'?'<span class="pv-date-type-inline-gap"></span>'+esc(bt4):''));
    if(de4) dtArr.push(esc(de4)+(dt4&&dt4!=='없음'?'<span class="pv-date-type-inline-gap"></span>'+esc(dt4):''));
    const dt=dtArr.join('&ensp;&ensp;');
    if(!nm && !bp && !dt && !rel && !isSlotStoneOn(d,i)) continue;
    const relHtml=rel?`<span class="pv-pyeong4-rel">${_relHtml(rel,38)}</span>`:'<span class="pv-pyeong4-rel"></span>';
    const nameLine=`<span class="pv-pyeong4-name-row ${rel?'has-rel':'no-rel'}">${relHtml}${bp?`<span class="pv-pyeong4-bp-after">${esc(bp)}</span>`:''}${nm?`<span class="pv-pyeong4-name">${esc(nm)}</span>`:'<span style="opacity:.3">성명</span>'}<span class="pv-pyeong4-rel-spacer"></span></span>`;
    const personBody=`<div class="pv-pyeong4-person"><div class="pv-name-lg">${nameLine}</div>${dt?`<div class="pv-date-sm">${dt}</div>`:''}</div>`;
    persons += isSlotStoneOn(d,i)
      ? `<div class="pv-pyeong4-stone-row"><div class="pv-song-photo-box"></div>${personBody}</div>`
      : personBody;
  }
  return `<div class="pv-pyeong4-stack">${persons || '<span style="opacity:.3">성명</span>'}</div>`;
}

function _renderFourPFront(d){
  // 4기P: 1,2 / 3,4 두 줄 구조. 3,4도 1,2와 동일한 좌우형 방식 적용.
  const rel=d.religion_mark||'';

      :'<span style="opacity:.3">성명</span>';

function _renderPyeongBubuPFront(d){
  // 평장부부P: 평장부부B 기본과 동일 방식. 스톤포토 선택 시 왼쪽 박스 표시.
  const rel=d.religion_mark||'';
  const stoneOn=stonePhotoCountFromData(d)>0;
  function dt(i){return _dateLine(d['f'+i+'_birth'],d['f'+i+'_birth_type'],d['f'+i+'_death'],d['f'+i+'_death_type']);}
  function personRow(i){
    const nm=d['f'+i+'_name']||'',bp=d['f'+i+'_baptism']||'',date=dt(i);
    if(!nm&&!bp&&!date) return '';
    const nameHtml=_bububNameWithBaptism(nm,bp,'pv-bubub');
    if(stoneOn){
      const photo=isSlotStoneOn(d,i)?'<div class="pv-song-photo-box"></div>':'<div></div>';
      return `<div class="pv-bubub-stone-row">${photo}<div><div class="pv-bubub-stone-namebox"><span class="pv-bubub-stone-name">${nameHtml}</span></div>${date?`<div class="pv-bubub-date">${date}</div>`:''}</div></div>`;
    }
    return `<div class="pv-bubub-person"><div class="pv-bubub-namebox"><span class="pv-bubub-name-only">${nameHtml}</span></div>${date?`<div class="pv-bubub-date">${date}</div>`:''}</div>`;
  }

function updatePreview(){
  const d=collectForm();
  const ri=$('pvReligionImg'); if(ri) ri.style.display='none';
  const lt=_getLayoutType(), rel=d.religion_mark||'', back=_renderBack(d);
  $('pvDates').innerHTML='';
  if($('pvLeftSide')) $('pvLeftSide').innerHTML='';
  $('pvSide').innerHTML='';
  $('previewWrap').className='preview-wrap split2';

  if(lt==='vertical_burial'){
    // 매장묘/평장부부B 2번: 글자별 세로 날짜 + 세로이름 + 지묘
    const mt=d.male_title||'', ft=d.female_title||'';
    const mb=_bongwanDisp(d.male_bongwan,'公','공');
    const fb=_bongwanDisp(d.female_bongwan,'氏','씨');
    const mParts=[(mt&&mt!=='없음'?esc(mt):''),mb,esc(d.male_name||'')].filter(Boolean);
    const fParts=[(ft&&ft!=='없음'?esc(ft):''),fb,esc(d.female_name||'')].filter(Boolean);
    const s1=_dateCharsDisplay(d.s1_birth,d.s1_birth_type,d.s1_death,d.s1_death_type);
    const s2=_dateCharsDisplay(d.s2_birth,d.s2_birth_type,d.s2_death,d.s2_death_type);
    const jv=d.jidmyo&&d.jidmyo!=='없음'?d.jidmyo:'';
    const s1Col=s1?`<div class="pv-burial-side-chars">${s1}</div>`:'';
    const s2Col=s2?`<div class="pv-burial-side-chars">${s2}</div>`:'';

    // 남자 사망 날짜는 고인이름 기준 왼쪽 측면, 여자 사망 날짜는 오른쪽 측면
    if(s1Col || s2Col){
      if($('pvLeftSide')) $('pvLeftSide').innerHTML=s1Col;
      $('pvSide').innerHTML=s2Col;
      $('previewWrap').className='preview-wrap split-burial-sides';
    }
    if(isSingleMaejang()){
      // 매장묘 단장: 종교마크/호칭/본관/이름/지묘를 중앙 한 축으로 정렬
      const mainCol=mParts.length?`<div class="pv-burial-name-col"><div class="pv-name-vt">${mParts.join('')}</div></div>`:'';
      $('pvNames').innerHTML=`
        <div class="pv-burial-single-front">
          <div class="pv-burial-single-main">${_relHtml(rel,72)}${mainCol}${jv?`<div class="pv-jidmyo-vt">${esc(jv)}</div>`:''}</div>
        </div>`;
    }else{
      // 매장묘 쌍분 전면 전용 렌더: 기존 공통 세로형과 분리
      const mCol=mParts.length?`<div class="pv-burial-name-col"><div class="pv-name-vt">${mParts.join('')}</div></div>`:'';
      const fCol=fParts.length?`<div class="pv-burial-name-col"><div class="pv-name-vt">${fParts.join('')}</div></div>`:'';
      const state=mCol&&fCol?'both':(mCol?'only-male':(fCol?'only-female':'empty'));
      $('pvNames').innerHTML=`
        <div class="pv-maejang-ssangbun-front ${state}">
          <div class="pv-maejang-ssangbun-rel">${_relHtml(rel,72)}</div>
          <div class="pv-maejang-ssangbun-name-row">
            <div class="pv-maejang-ssangbun-name-left">${mCol}</div>
            <div class="pv-maejang-ssangbun-center-gap"></div>
            <div class="pv-maejang-ssangbun-name-right">${fCol}</div>
          </div>
          ${jv?`<div class="pv-maejang-ssangbun-jidmyo"><div class="pv-jidmyo-vt">${esc(jv)}</div></div>`:''}
        </div>`;
    }
    $('pvDates').innerHTML='';
    $('pvBack').innerHTML=_renderBackBurial(d);

  } else if(lt==='family_phrase'){
    const fb=d.family_bongwan||''; let display=fb?fb:'○○○';
    if(fb){const lc=fb[fb.length-1];if(!fb.endsWith('씨')&&!fb.endsWith('氏'))display+=(_isHanjaChar(lc)?'氏':'씨');}
    const cnt=Number(d.slot_count||1); let slots='';
    for(let i=1;i<=cnt;i++){const nm=d['f'+i+'_name']||'',bp=d['f'+i+'_baptism']||'';const dt=_dateLine(d['f'+i+'_birth'],d['f'+i+'_birth_type'],d['f'+i+'_death'],d['f'+i+'_death_type']);if(nm||bp||dt)slots+=`<div class="pv-multi-slot">${bp?`<div class="pv-baptism">${esc(bp)}</div>`:''}${nm?`<div class="pv-name-md">${esc(nm)}</div>`:''}<div class="pv-date-xs">${dt}</div></div>`;}
    $('pvNames').innerHTML=`${_relHtml(rel,48)}<div class="pv-family-phrase">${esc(display)} 가족지묘</div>`;
    $('pvBack').innerHTML=`${slots?`<div class="pv-multi-grid" style="margin-bottom:8px">${slots}</div>`:''}${back}`;

  } else if(lt==='family_8'){
    // 8기: 왼쪽 빈칸 제거. 중앙 카드=가족지묘, 오른쪽 카드=고인, 하단=자손
    if($('pvLeftSide')) $('pvLeftSide').innerHTML='';
    $('pvNames').innerHTML=_renderFamilyFrontPhraseOnly(d);
    $('pvSide').innerHTML=_renderFamilyPeopleVertical(d);
    $('previewWrap').className='preview-wrap split-family8';
    $('pvDates').innerHTML='';

  } else if(lt==='family_front_back_vertical'){
    $('pvNames').innerHTML=_renderFamilyFrontPhraseOnly(d);
    $('pvDates').innerHTML='';
    $('pvBack').innerHTML=_renderFamilyPeopleVertical(d);

  } else if(lt==='family_vertical_back_horizontal'){
    $('pvNames').innerHTML=_renderFamilyFrontPhraseVertical(d);
    $('pvDates').innerHTML='';
    $('pvBack').innerHTML=_renderFamilyPeopleHorizontal(d,false);

  } else if(lt==='family_24'){
    $('pvNames').innerHTML=_renderFamilyFrontPhraseVertical(d,false);
    $('pvDates').innerHTML='';
    $('pvBack').innerHTML=_renderFamilyPeopleHorizontal(d,true);

  } else if(lt==='pyeongjang1p'){
    // 단납/평장1기 1인형과 동일 렌더링, 세례명만 이름 위(pv-p1p-namebox)로
    const nm=d.f1_name||'',bp=d.f1_baptism||'';
    const dt=_dateLine(d.f1_birth,d.f1_birth_type,d.f1_death,d.f1_death_type);

      ?`<div class="pv-p1p-namebox">${bp?`<div class="pv-baptism">${esc(bp)}</div>`:''}${nm?`<div class="pv-single-name">${esc(nm)}</div>`:'<span style="opacity:.3">성명</span>'}</div>`

  } else if(lt==='songsujae_single'){
    // 송수재 개인: 종교마크는 이름 왼쪽, 세례명은 이름 위.
    // 세례명 시작점과 고인 이름 시작점을 같은 라인으로 맞춘다.
    const nm=d.f1_name||'', bp=d.f1_baptism||'';

    const nameBox=`<div class="pv-song-namebox song-top-bp ${hasBp?'has-bp':'no-bp'}">${(nm||bp)?`${bp?`<div class="pv-baptism pv-song-bp-top">${esc(bp)}</div>`:''}${nm?`<div class="pv-name-lg">${esc(nm)}</div>`:''}`:'<span style="opacity:.3">성명</span>'}</div>`;
    $('pvNames').innerHTML=`<div class="pv-song-front"><div class="pv-song-main song-single ${hasBp?'has-bp':'no-bp'}"><div class="pv-song-religion-left">${_relHtml(rel,92)}</div>${nameBox}</div></div>`;
    $('pvDates').innerHTML=dt?`<div class="pv-song-dates">${dt}</div>`:'';
    $('pvBack').innerHTML=_renderBackSongSujae(d);

  } else if(lt==='songsujae_couple'){
    // 송수재 부부: 종교마크는 상단 중앙. 스톤포토 추가 시 왼쪽 사진 박스 + 오른쪽 이름 영역
    const nm=d.f1_name||'', bp=d.f1_baptism||'';
    const dt=_dateLine(d.f1_birth,d.f1_birth_type,d.f1_death,d.f1_death_type);
    const nameBox=`<div class="pv-song-namebox">${bp?`<div class="pv-baptism">${esc(bp)}</div>`:''}${nm?`<div class="pv-name-lg">${esc(nm)}</div>`:'<span style="opacity:.3">성명</span>'}</div>`;
    const content=`<div class="pv-song-main song-couple"><div class="pv-song-religion-top">${_relHtml(rel,48)}</div>${nameBox}</div>`;
    const stoneOn = stonePhotoCountFromData(d) > 0;
    $('pvNames').innerHTML= stoneOn
      ? `<div class="pv-song-stone-front"><div class="pv-song-photo-box"></div>${content}</div>`
      : `<div class="pv-song-front">${content}</div>`;
    $('pvDates').innerHTML=dt?`<div class="pv-song-dates">${dt}</div>`:'';
    $('pvBack').innerHTML=_renderBackSongSujae(d);

  } else if(lt==='single_hoz'){
    // 1인형: 이름 가로 크게 (세로쓰기 금지)
    const nm=d.f1_name||'',bp=d.f1_baptism||'';
    const dt=_dateLine(d.f1_birth,d.f1_birth_type,d.f1_death,d.f1_death_type);
    const stoneOn = isSlotStoneOn(d,1) || stonePhotoCountFromData(d) > 0;
    const mainName = `${_relHtml(rel,52)}${(nm||bp)?_personHoz(nm,bp,''):'<span style="opacity:.3">성명</span>'}`;
    $('pvNames').innerHTML = stoneOn
      ? `<div class="pv-single-stone-front"><div class="pv-song-photo-box"></div><div class="pv-single-stone-main">${mainName}</div></div>`
      : mainName;
    $('pvDates').innerHTML=dt?`<div class="pv-dates-hoz">${dt}</div>`:'';
    $('pvBack').innerHTML=_renderBackSingle3col(d)||back;

  } else if(lt==='couple_lr'){
    // 좌우형 (쌍납/평장부부A): 2인 가로 나란히
    const cnt=Math.min(Number(d.slot_count||1),2); let persons='';
    for(let i=1;i<=cnt;i++){
      const nm=d['f'+i+'_name']||'',bp=d['f'+i+'_baptism']||'';
      const dt=_dateLine(d['f'+i+'_birth'],d['f'+i+'_birth_type'],d['f'+i+'_death'],d['f'+i+'_death_type']);
      const personClass = i === 1 ? 'couple-lr-male' : 'couple-lr-female';
      const nameBox = (nm||bp)
        ? `<div class="pv-couple-namebox">${bp?`<div class="pv-baptism">${esc(bp)}</div>`:''}${nm?`<div class="pv-name-lg">${esc(nm)}</div>`:'<span style="opacity:.3">성명</span>'}</div>`
        : '<span style="opacity:.3">성명</span>';
      persons+=`<div class="pv-person ${personClass}">${nameBox}<div class="pv-date-sm">${dt}</div></div>`;
    }
    $('pvNames').innerHTML=`${_relHtml(rel,44)}<div class="pv-names-row couple-lr-row">${persons}</div>`;
    // 쌍납/평장부부A 후면 자손은 평장1기/단납과 동일 구조 사용
    $('pvBack').innerHTML=_renderBackSingle3col(d)||back;

  } else if(lt==='couple_tb'){
    // 상하형 (부부A/납골정/평장부부B/P): 2인 위아래
    if(d.category === '평장부부B' && d.subcategory === '기본'){
      $('pvNames').innerHTML = _renderBubuBDefaultFront(d);
      $('pvDates').innerHTML = '';
      // 평장부부B 기본 후면은 평장1기/단납과 동일
      $('pvBack').innerHTML = _renderBackSingle3col(d);
      return;
    }
    if(d.category === '평장부부B' && d.subcategory === '1번'){
      $('pvNames').innerHTML = _renderBubuB1FrontLikeDefault(d);
      $('pvDates').innerHTML = '';
      $('pvBack').innerHTML = _renderBackBurial(d);
      return;
    }
    if(d.category === '평장부부B' && ['3번','4번'].includes(d.subcategory)){
      // 평장부부B 3번/4번 전면도 1번과 동일하게, 즉 평장부부B 기본형의 고인이름+날짜 방식으로 출력
      $('pvNames').innerHTML = _renderBubuB1FrontLikeDefault(d);
      $('pvDates').innerHTML = '';
      $('pvBack').innerHTML = _renderBackBurial(d);
      return;
    }
    if(d.category==='평장부부P'){
      $('pvNames').innerHTML=_renderPyeongBubuPFront(d);
      $('pvDates').innerHTML='';
      $('pvBack').innerHTML=_renderBackSingle3col(d);
      return;
    }
    const cnt=Math.min(Number(d.slot_count||1),2); let persons='';
    for(let i=1;i<=cnt;i++){
      const nm=d['f'+i+'_name']||'',bp=d['f'+i+'_baptism']||'';
      const dt=_dateLine(d['f'+i+'_birth'],d['f'+i+'_birth_type'],d['f'+i+'_death'],d['f'+i+'_death_type']);
      const nameHtml = (nm || bp)
        ? `<div class="pv-name-lg pv-tb-inline-name">${bp?`<span class="pv-bp-front-inline pv-tb-bp-inline">${esc(bp)}</span>`:''}${nm?esc(nm):''}</div>`
        : '<span style="opacity:.3">성명</span>';
      persons+=`<div class="pv-tb-person">${nameHtml}<div class="pv-date-sm">${dt}</div></div>`;
    }
    $('pvNames').innerHTML=`${_relHtml(rel,44)}<div class="pv-tb-stack">${persons}</div>`;
    // 부부A 후면(자손)은 매장묘 후면과 동일한 방식으로 출력
    // 납골정 후면(자손)은 송수재 개인 후면과 동일한 방식으로 출력
    // 전면 구조 및 기존 계산/저장/불러오기/프린트는 변경하지 않음
    $('pvBack').innerHTML = (d.category === '부부A')
      ? _renderBackBubuAOnly(d)
      : (d.category === '납골정' ? _renderBackSongSujae(d) : back);

  } else {
    // multi_person (4기, 평장4기 등)
    const cnt=Number(d.slot_count||1); let slots='';
    for(let i=1;i<=cnt;i++){
      const nm=d['f'+i+'_name']||'',bp=d['f'+i+'_baptism']||'';
      const bpHtml=bp?`<div style="font-size:.58rem;color:#bbb;margin-bottom:1px">${esc(bp)}</div>`:'';
      const dt=_dateLine(d['f'+i+'_birth'],d['f'+i+'_birth_type'],d['f'+i+'_death'],d['f'+i+'_death_type']);
      slots+=`<div class="pv-multi-slot">${bpHtml}${nm?`<div class="pv-name-md">${esc(nm)}</div>`:''}<div class="pv-date-xs">${dt}</div></div>`;
    }
    $('pvNames').innerHTML=`${_relHtml(rel,36)}<div class="pv-multi-grid">${slots}</div>`;
    $('pvBack').innerHTML=back;
  }
}
async function calc(){
  try{
    const res=await fetch('/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collectForm())});
    if(!res.ok){
      const txt=await res.text().catch(()=> '');
      console.error('calc api error', res.status, txt);
      if($('summaryBox')) $('summaryBox').innerHTML=`<div class="calc-lines"><div class="calc-row"><span class="calc-label">계산 오류</span><span class="calc-value">서버 응답 오류(${res.status})</span></div></div>`;
      return;
    }
    currentSummary=await res.json();
  }catch(err){
    console.error('calc failed', err);
    if($('summaryBox')) $('summaryBox').innerHTML=`<div class="calc-lines"><div class="calc-row"><span class="calc-label">계산 오류</span><span class="calc-value">연결/스크립트 오류</span></div></div>`;
    return;
  }

  const s=currentSummary || {};
  const n=(v)=>Number(v||0);
  const fmt=(v)=>n(v).toLocaleString('ko-KR');
  const smallTotalCnt=n(s.small_korean_cnt)+n(s.small_hanja_cnt);
  const smallTotalAmt=n(s.small_korean_amt)+n(s.small_hanja_amt);
  const midTotalCnt=n(s.mid_korean_cnt)+n(s.mid_hanja_cnt);
  const midTotalAmt=n(s.mid_korean_amt)+n(s.mid_hanja_amt);
  let rows='';
  if(n(s.big_korean_cnt)) rows+=`<div class="calc-row"><span class="calc-label">큰글자 한글</span><span class="calc-value">${n(s.big_korean_cnt)}자 × ${fmt(s.big_korean_unit)}원 = ${money(n(s.big_korean_amt))}</span></div>`;
  if(n(s.big_hanja_cnt))  rows+=`<div class="calc-row"><span class="calc-label">큰글자 한자</span><span class="calc-value">${n(s.big_hanja_cnt)}자 × ${fmt(s.big_hanja_unit)}원 = ${money(n(s.big_hanja_amt))}</span></div>`;
  if(!n(s.big_korean_cnt) && !n(s.big_hanja_cnt)) rows+=`<div class="calc-row"><span class="calc-label">큰글자</span><span class="calc-value">0자</span></div>`;
  if(n(s.mid_korean_cnt)) rows+=`<div class="calc-row"><span class="calc-label">중글자 한글</span><span class="calc-value">${n(s.mid_korean_cnt)}자 × ${fmt(s.mid_korean_unit)}원 = ${money(n(s.mid_korean_amt))}</span></div>`;
  if(n(s.mid_hanja_cnt))  rows+=`<div class="calc-row"><span class="calc-label">중글자 한자</span><span class="calc-value">${n(s.mid_hanja_cnt)}자 × ${fmt(s.mid_hanja_unit)}원 = ${money(n(s.mid_hanja_amt))}</span></div>`;
  if(n(s.small_korean_cnt)) rows+=`<div class="calc-row"><span class="calc-label">작은글자 한글</span><span class="calc-value">${n(s.small_korean_cnt)}자 × ${fmt(s.small_korean_unit)}원 = ${money(n(s.small_korean_amt))}</span></div>`;
  if(n(s.small_hanja_cnt))  rows+=`<div class="calc-row"><span class="calc-label">작은글자 한자</span><span class="calc-value">${n(s.small_hanja_cnt)}자 × ${fmt(s.small_hanja_unit)}원 = ${money(n(s.small_hanja_amt))}</span></div>`;
  if(s.stone_added) rows+=`<div class="calc-row"><span class="calc-label">스톤포토</span><span class="calc-value">${n(s.stone_count)||1}개 × ${money(n(s.stone_unit)||120000)} = ${money(n(s.stone_amt))}</span></div>`;
  $('summaryBox').innerHTML=`
    <div class="calc-lines">
      ${rows}
      <div class="calc-total-line">총 금액 : ${money(n(s.total))}</div>
    </div>
    <div class="calc-chips">
      <div class="calc-chip calc-chip-big"><span>大 큰글씨</span><strong>${n(s.big_cnt)}자 / ${money(n(s.big_amt))}</strong></div>
      ${midTotalCnt ? `<div class="calc-chip calc-chip-mid"><span>中 중글씨</span><strong>${midTotalCnt}자 / ${money(midTotalAmt)}</strong></div>` : ''}
      <div class="calc-chip calc-chip-small"><span>小 작은글씨</span><strong>${smallTotalCnt}자 / ${money(smallTotalAmt)}</strong></div>
      ${s.stone_added ? `<div class="calc-chip calc-chip-stone"><span>스톤포토 ${n(s.stone_count)||1}개</span><strong>${money(n(s.stone_amt))}</strong></div>` : ''}
      <div class="calc-chip calc-chip-total"><span>최종 합계</span><strong>${money(n(s.total))}</strong></div>
    </div>`;
}
async function savePreviewPngToServer(filename){
  try{
    if(!window.html2canvas || !filename) return;
    const panel=document.querySelector('.preview-panel');
    if(!panel) return;

    // 화면의 미리보기+계산 영역을 A4 폭 클론으로 만들어 캡처
    const holder=document.createElement('div');
    holder.className='a4-capture-clone';
    holder.style.position='fixed';
    holder.style.left='-99999px';
    holder.style.top='0';
    const clone=panel.cloneNode(true);
    holder.appendChild(clone);
    document.body.appendChild(holder);

    const canvas=await html2canvas(holder, {
      scale:2,
      backgroundColor:'#f4f1e4',
      useCORS:true,
      logging:false,
      width:794,
      windowWidth:794,
    });
    document.body.removeChild(holder);

    const image=canvas.toDataURL('image/png');
    await fetch('/api/save-preview', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename, image})
    });
  }catch(e){
    console.warn('PNG 미리보기 저장 실패:', e);
  }
}

async function saveForm(){
  await calc();
  updatePreview();
  const data=collectForm();
  const res=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const out=await res.json();
  if(out.ok){
    $('dataId').value=out.id;
    if(!$('createdAt').value) $('createdAt').value=out.item.created_at;
    if($('dataFile')) $('dataFile').value=out.data_file || out.item.data_file || '';
    if($('previewFile')) $('previewFile').value=out.preview_file || out.item.preview_file || '';
    // JSON 저장 후 같은 파일명으로 A4 PNG도 NAS preview 폴더에 저장
    await savePreviewPngToServer(out.preview_file || out.item.preview_file);
    $('saveMsg').textContent='저장 완료';
    setTimeout(()=>$('saveMsg').textContent='',1800);
    await refreshList();
  } else alert('저장 실패');
}
async function refreshList(){ const r=await fetch('/api/list'); savedList=await r.json(); renderList(savedList); }
function renderList(list){
  const q=($('listSearch')?.value||'').trim().toLowerCase(); const filtered=(list||[]).filter(item=>!q || [item.contract_no,item.contractor,item.type_label,item.status,item.writer,item.designer,item.checker].join(' ').toLowerCase().includes(q));
  $('listBody').innerHTML = filtered.map(item=>{
    const staffChips=[item.writer&&`<span class="chip-staff">작성: ${esc(item.writer)}</span>`,item.designer&&`<span class="chip-staff">작업: ${esc(item.designer)}</span>`,item.checker&&`<span class="chip-staff">검수: ${esc(item.checker)}</span>`].filter(Boolean).join('');
    return `<div class="saved-card">
    <div class="saved-card-top"></div><div class="saved-card-body">
      <div class="saved-title"><span>${esc(item.contract_no ? '#'+item.contract_no : '계약번호 없음')}</span><span>${esc(item.contractor||'계약자 없음')}</span><span class="saved-time">${esc(item.created_at)}</span></div>
      <div class="saved-sub" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px"><span>${esc(item.type_label)}</span>${staffChips}</div>
      <div class="saved-chips"><span class="chip-mini">큰글자 ${money(item.big_amt)}</span><span class="chip-mini">작은글자 ${money(item.small_amt)}</span>${String(item.stone_photo||'')?`<span class="chip-mini chip-stone-red">스톤포토 추가</span>`:''}<span class="saved-amount">${money(item.total)}</span> <button class="btn small-btn btn-send" onclick="markSent('${item.id}')">시안문자발송</button></div>
    </div><div class="saved-actions"><button class="btn small-btn load-btn" onclick="loadItem('${item.id}')">불러오기</button><button class="btn small-btn del-btn" onclick="deleteItem('${item.id}')">삭제</button></div>
  </div>`;}).join('') || `<div class="saved-card"><div class="saved-card-body" style="text-align:center;color:#9a816d">저장된 신청서가 없습니다.</div></div>`;
}
async function markSent(id){
  const r=await fetch('/api/load/'+id); const out=await r.json(); if(!out.ok) return;
  out.data.status='시안문자발송';
  await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(out.data)});
  refreshList();
}
function openList(){ refreshList(); $('drawerBg').classList.add('open'); $('drawer').classList.add('open'); }
function closeList(){ $('drawerBg').classList.remove('open'); $('drawer').classList.remove('open'); }
async function loadItem(id){ const r=await fetch('/api/load/'+id); const out=await r.json(); if(out.ok){ fillForm(out.data); closeList(); showPage('page1'); } }
async function deleteItem(id){ if(!confirm('삭제할까요?')) return; await fetch('/api/delete/'+id,{method:'POST'}); refreshList(); }
function newForm(){ if(confirm('전체 새로 작성할까요? 모든 입력 내용이 지워집니다.')) location.reload(); }
function resetCurrentPage(){
  const pg=document.querySelector('.page.active')?.id;
  if(!confirm('현재 페이지 입력을 초기화할까요?')) return;
  if(pg==='page1'){
    ['contractNo','contractor','phone','jigu','yeol','ho'].forEach(id=>{const el=$(id);if(el)el.value='';});
    const cat=$('category');if(cat){cat.value='매장묘';fillSubcategory('단장');}
    ['writer','designer','checker'].forEach(id=>{const el=$(id);if(el)el.selectedIndex=0;});
    const st=$('status');if(st)st.value='접수됨';
    const wm=$('workMemo');if(wm)wm.value='';
    updateTemplateLabel();
  } else if(pg==='page2'){
    const rm=$('religionMark');if(rm)rm.value='';
    const ft=$('frontType');if(ft)ft.value='korean';
    const sdt=$('sideType');if(sdt)sdt.value='korean';
    const bt=$('backType');if(bt)bt.value='korean';
    ['maleTitle','maleBongwan','maleName','femaleTitle','femaleBongwan','femaleName','jidmyo','familyBongwan'].forEach(id=>{const el=$(id);if(el)el.value='';});
    ['s1Birth','s1Death','s2Birth','s2Death'].forEach(id=>{const el=$(id);if(el)el.value='';});
    ['son_text','daughter_in_law_text','grandson_text','daughter_text','son_in_law_text','maternal_grandchild_text','etc_text'].forEach(n=>{const el=document.querySelector('[name="'+n+'"]');if(el)el.value='';});
    const sp=$('stonePhoto');if(sp)sp.checked=false;
    renderSlots(getRule().slots||1);
    updateUI(); updatePreview(); calc();
  }
}

// 📞 연락처 자동 하이픈
function formatPhoneNumber(value){
  const num = String(value || '').replace(/\D/g, '').slice(0, 11);
  if(num.length <= 3) return num;
  if(num.length <= 7) return num.slice(0, 3) + '-' + num.slice(3);
  return num.slice(0, 3) + '-' + num.slice(3, 7) + '-' + num.slice(7, 11);
}
function bindPhoneAutoHyphen(){
  const phoneInput = document.getElementById('phone');
  if(!phoneInput) return;
  phoneInput.setAttribute('maxlength', '13');
  phoneInput.addEventListener('input', function(e){
    e.target.value = formatPhoneNumber(e.target.value);
  });
  phoneInput.addEventListener('blur', function(e){
    e.target.value = formatPhoneNumber(e.target.value);
  });
}
bindPhoneAutoHyphen();

init();
